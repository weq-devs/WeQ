name: QQ version watch

# 每晚抓 QQ 官网的 PC 版本清单 → 有新版就验证签名兼容性 → 用 commit 直接更新 main。
#
# 数据源与官网下载页一致（`im.qq.com` 用的 `pcConfig.json`），见
# scripts/refresh-qq-versions.mts 的头部注释。
#
# 两条独立的工作：
#   1. `refresh`：所有版本都要跑 —— 抓清单、写 `versions/latest.json` 与
#      `versions/supported.json` 的 pending 列表。
#   2. `compat`：**只有新版本**才跑 —— 下载安装包、取出 wrapper.node、用 pinned
#      nt_helper 产物跑 `checkSigner()`。失败就让 job 红，不自动修。
#
# 为什么 compat 失败「只红不修」：RVA 定位失败意味着 QQ 换了签名器结构，
# 那必须人来看（VM 入口可能要重新逆）。自动改代码只会把问题藏起来。
on:
  schedule:
    # UTC 16:00 = 北京时间 00:00。GitHub 的 cron 在高负载时可能延迟十几分钟。
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_compat:
        description: '即使版本没变也跑一遍签名兼容性验证'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: qq-version-watch
  cancel-in-progress: false

env:
  # 版本清单与 CI 产物放在一起，避免各 job 重复抓。
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  refresh:
    name: Refresh version catalog
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      changes: ${{ steps.refresh.outputs.changes }}
      versions: ${{ steps.refresh.outputs.versions }}
      # 还没通过验证的最新版本平台。兼容性验证按这个跑，而不是只在「清单变了」
      # 那一晚跑：CDN 放开、上一轮扫描失败都需要第二天重试。
      unverified: ${{ steps.plan.outputs.unverified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch QQ versions
        id: refresh
        run: pnpm versions:refresh --write

      - name: Commit if changed
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- versions; then
            echo "工作区没有实际差异（可能只是 updateDate 变了），跳过提交"
            exit 0
          fi
          # 提交者用真实的 bot 身份（ninebird-bot 的 GitHub App），这样
          # commit 上的头像/链接指向应用页，而不是一个编出来的邮箱。
          git config user.name  'ninebird-bot[bot]'
          git config user.email '317614958+ninebird-bot[bot]@users.noreply.github.com'
          git add versions
          git commit -m "chore(versions): 更新 QQ 版本清单 ${{ steps.refresh.outputs.versions }}

          来源：https://qq-web.cdn-go.cn/im.qq.com_new/latest/rainbow/pcConfig.json
          变化：${{ steps.refresh.outputs.changes }}
          由 .github/workflows/qq-version-watch.yml 自动生成。"
          # main 上可能有新提交（例如同一天别人的改动），先 rebase 再推送。
          git pull --rebase --autostash origin main
          if ! git push origin HEAD:main; then
            echo "::error::版本清单推送失败（main 可能刚被改动），需要人工确认"
            exit 1
          fi
          echo "pushed: $(git rev-parse --short HEAD)"

      # 决定哪些平台还要跑兼容性验证：只要「官网最新版」还没出现在
      # supported.json 里就值得再试一次（CDN 灰度、上一轮失败都会走到这里）。
      #
      # 注意用工作区里的文件，而不是 `git show origin/main`:前一步刚落盘（以及
      # 可能刚提交）的 latest.json 才是这一轮的事实。
      - name: Plan compat
        id: plan
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const latest = JSON.parse(fs.readFileSync("versions/latest.json", "utf8"));
            const supported = JSON.parse(fs.readFileSync("versions/supported.json", "utf8"));
            const pending = [];
            for (const [platform, info] of Object.entries(latest.versions)) {
              const ok = (supported.platforms?.[platform] ?? []).some(
                (v) => v.version === info.version && v.sign?.ok,
              );
              if (!ok) pending.push(platform);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "unverified=" + JSON.stringify(pending) + "\n");
            console.log("unverified platforms:", pending);
          '

      - name: Summary
        run: |
          {
            echo "## QQ 版本清单"
            echo '```'
            pnpm versions:refresh
            echo '```'
            echo
            echo "未验证（本轮会尝试）：${{ steps.plan.outputs.unverified }}"
          } >> "$GITHUB_STEP_SUMMARY"

  compat:
    name: Check signing on ${{ matrix.platform }}
    needs: refresh
    if: needs.refresh.outputs.unverified != '[]' || inputs.force_compat
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            native: nt_helper-win32-x64.node
          - platform: linux-x64
            runner: ubuntu-latest
            native: nt_helper-linux-x64.node
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            native: nt_helper-linux-arm64.node
          - platform: macos-x64
            runner: macos-15-intel
            native: nt_helper-darwin-x64.node
          - platform: macos-arm64
            runner: macos-15
            native: nt_helper-darwin-arm64.node
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve target version
        id: target
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          UNVERIFIED: ${{ needs.refresh.outputs.unverified }}
          FORCE: ${{ inputs.force_compat }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const latest = JSON.parse(fs.readFileSync("versions/latest.json", "utf8"));
            const platform = process.env.PLATFORM;
            const entry = latest.versions[platform];
            if (!entry) { console.error("latest.json 里没有 " + platform); process.exit(1); }
            const wanted = JSON.parse(process.env.UNVERIFIED || "[]");
            const skip = process.env.FORCE !== "true" && !wanted.includes(platform);
            const lines = [
              "version=" + entry.version,
              "url=" + (entry.url ?? ""),
              "skip=" + skip,
            ];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '

      - name: Fetch pinned nt_helper
        shell: bash
        run: |
          set -euo pipefail
          tag=$(node -e 'console.log(require("./native/pinned.json").tag)')
          echo "pinned=$tag"
          mkdir -p "$RUNNER_TEMP/native"
          gh release download "$tag" --repo weq-devs/nt_helper_release \
            --pattern '${{ matrix.native }}' --dir "$RUNNER_TEMP/native"
          ls -lh "$RUNNER_TEMP/native"

          # 产物必须带 checkSigner：它是这个 workflow 唯一依赖的接口。老构建
          # 没有的话直接停在这里，比跑到一半报「不是函数」清楚。
          node --input-type=module -e '
            import { createRequire } from "node:module";
            const require = createRequire(process.cwd() + "/");
            const nt = require(process.env.RUNNER_TEMP + "/native/${{ matrix.native }}");
            if (typeof nt.checkSigner !== "function") {
              console.error("pinned nt_helper 产物缺少 checkSigner；先发布一份新构建再升级 native/pinned.json");
              process.exit(1);
            }
            console.log("checkSigner ok; build:", JSON.stringify(nt.getBuildInfo?.() ?? null));
          '

      - name: Download QQ installer
        id: download
        shell: bash
        if: steps.target.outputs.skip != 'true'
        env:
          URL: ${{ steps.target.outputs.url }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -uo pipefail
          case "$URL" in
            *.deb) ext=deb ;;
            *.dmg) ext=dmg ;;
            *.exe) ext=exe ;;
            *) ext=bin ;;
          esac
          out="$RUNNER_TEMP/qq/installer.$ext"
          mkdir -p "$RUNNER_TEMP/qq"

          # pcConfig 给的地址直接 GET 会 403：官网页面也是先调内部接口换一个
          # 带 ?sign=&t= 的短时链接。签名失败就当作「暂时拿不到」，下一天重试。
          # 空输出也要当失败：脚本若因入口判断/平台差异静默退出，退出码是 0
          # 但什么都没做（Windows 上踩过），不能让它变成「下载空地址」。
          if ! signed=$(node scripts/sign-qq-download.mjs "$URL") || [ -z "$signed" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::${VERSION} 的下载地址签名失败（接口可能变了）"
            exit 1
          fi
          echo "signed url acquired (len=${#signed})"

          code=$(curl -sSL --retry 3 --retry-delay 5 -o "$out" -w '%{http_code}' "$signed" || echo 000)
          size=$(wc -c < "$out" 2>/dev/null || echo 0)
          echo "http=$code size=$size"
          if [ "$code" = "403" ] || [ "$code" = "404" ]; then
            echo "outcome=cdn-not-ready" >> "$GITHUB_OUTPUT"
            # 签名过了但对象还不存在：腾讯在「刚发布」的窗口期会先更新
            # pcConfig.json，隔一阵才把产物传到 CDN。这不是我们的缺陷，
            # 下个自然日会重试（Plan compat 每天重新判定）。写成 warning，
            # 但 job 标成「跳过」，不能假装验证过。
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=cdn-not-ready" >> "$GITHUB_OUTPUT"
            echo "::warning::${VERSION} 的安装包在 CDN 上还拿不到（http=${code}），本轮跳过，明天重试"
            {
              echo "### ${{ matrix.platform }} ${VERSION}"
              echo "CDN 尚未放出该版本（http=${code}），本轮跳过。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" != "200" ] || [ "$size" -lt 10000000 ]; then
            # 其它情况是真失败：网络错误、返回了 HTML、文件明显不对。
            echo "::error::${VERSION} 的安装包下载失败（http=${code} size=${size} url=${URL}）"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # Windows 的 exe 单独走 pwsh：Node 的 spawnSync 在 CI 上等安装器行为不稳
      # （TITD 用 Start-Process -Wait 稳定 3 分钟跑完）。deb/dmg 仍用同一个
      # 跨平台脚本，逻辑只维护一份。
      - name: Extract wrapper.node (Windows)
        id: extract_win
        if: steps.download.outputs.available == 'true' && matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          PKG: ${{ steps.download.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'unpack\windows-x64\installed'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Write-Host "[$(Get-Date -Format o)] 开始安装到 $target"
          # NSIS 的 /D= 必须拼成单个字符串、不加引号。
          $installerArgs = "/S /D=$target"
          $p = Start-Process -FilePath $env:PKG -ArgumentList $installerArgs -Wait -PassThru
          Write-Host "[$(Get-Date -Format o)] installer exit=$($p.ExitCode)"

          $candidates = @(
            $target,
            "$env:ProgramFiles\Tencent\QQNT",
            "$env:LOCALAPPDATA\Programs\Tencent\QQNT"
          )
          $appDir = $null
          for ($attempt = 0; $attempt -lt 12 -and -not $appDir; $attempt++) {
            foreach ($root in $candidates) {
              $versions = Join-Path $root 'versions'
              if (-not (Test-Path $versions)) { continue }
              foreach ($v in Get-ChildItem $versions -Directory -ErrorAction SilentlyContinue) {
                $candidate = Join-Path $v.FullName 'resources\app\wrapper.node'
                if (Test-Path $candidate) {
                  $appDir = Split-Path $candidate -Parent
                  break
                }
              }
              if ($appDir) { break }
            }
            if (-not $appDir) { Start-Sleep -Seconds 5 }
          }
          if (-not $appDir) {
            Write-Host "::error::安装后没找到 wrapper.node（找过：$($candidates -join '、')）"
            exit 1
          }
          Write-Host "[$(Get-Date -Format o)] wrapper 在 $appDir"
          "wrapper=$appDir\wrapper.node" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract wrapper.node (Unix)
        id: extract
        if: steps.download.outputs.available == 'true' && matrix.platform != 'windows-x64'
        shell: bash
        env:
          PKG: ${{ steps.download.outputs.path }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          wrapper=$(node scripts/extract-qq-wrapper.mjs "$PKG" "$RUNNER_TEMP/unpack/$PLATFORM")
          ls -lh "$wrapper"
          echo "wrapper=$wrapper" >> "$GITHUB_OUTPUT"

      - name: Run checkSigner
        id: check
        if: steps.extract.outputs.wrapper != '' || steps.extract_win.outputs.wrapper != ''
        shell: bash
        env:
          WRAPPER: ${{ steps.extract.outputs.wrapper || steps.extract_win.outputs.wrapper }}
          NATIVE_MODULE: ${{ runner.temp }}/native/${{ matrix.native }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -uo pipefail
          code=0
          node --input-type=module -e '
            import { createRequire } from "node:module";
            const require = createRequire(process.cwd() + "/");
            const nt = require(process.env.NATIVE_MODULE);
            const result = { wrapper: process.env.WRAPPER, version: process.env.VERSION };
            try {
              result.report = nt.checkSigner(process.env.WRAPPER, 3);
            } catch (error) {
              result.error = String((error && error.message) || error);
            }
            const r = result.report;
            // 「兼容」= sign_core 定位到了，并且三次签名都成功。
            result.ok = Boolean(r && r.signCoreRva !== undefined && r.failures === 0 &&
                             r.signLengths.length === 3);
            // VM 单独标记：VM 定位失败时会退回完整签名函数，功能仍然可用，
            // 所以不参与 ok，但必须在报告里明确写出来。
            result.vmDirect = Boolean(r && r.vmRva !== undefined && r.pathUsed === "vm");
            console.log(JSON.stringify(result, null, 2));
            process.exit(result.ok ? 0 : 1);
          ' | tee "$RUNNER_TEMP/qq/result.json"
          code=${PIPESTATUS[0]}
          {
            echo "### ${{ matrix.platform }} $VERSION"
            echo '```json'
            cat "$RUNNER_TEMP/qq/result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::${{ matrix.platform }} $VERSION 的签名兼容性验证失败"
          fi
          exit "$code"

      # 没产生报告（CDN 还没放开）时也要留个可追踪的标记：否则 artifact 里
      # 什么都没有，record job 又按空目录处理，看起来像「跑完了没问题」。
      - name: Mark skipped
        if: steps.download.outputs.available != 'true'
        # Windows runner 的默认 shell 是 pwsh：这里显式用 bash，别让 heredoc 落到 pwsh。
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qq"
          cat > "$RUNNER_TEMP/qq/result.json" <<EOF
          {"platform":"${{ matrix.platform }}","version":"${{ steps.target.outputs.version }}","ok":false,"skipped":"cdn-not-ready"}
          EOF
          echo "::warning::${{ matrix.platform }} ${{ steps.target.outputs.version }} 未验证：CDN 尚未放出该版本"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signcheck-${{ matrix.platform }}
          path: ${{ runner.temp }}/qq/result.json
          if-no-files-found: warn
          retention-days: 30

  record:
    name: Record verified version
    needs: [refresh, compat]
    # compat 失败就不写 supported.json —— 只登记真正验证通过的组合。
    # 全部被跳过（CDN 还没放开）时也跳过，省一次空 commit。
    if: success() && (needs.refresh.outputs.unverified != '[]' || inputs.force_compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # compat 的各 job 把报告放在 artifact 里；这里逐个取回来汇总。
      # 每个平台的 artifact 落到 reports/<platform>/result.json。
      # 不 merge-multiple：同名文件会互相覆盖，剩下的就只剩一个平台了。
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: signcheck-*
          path: reports
          # 没匹配到也要建目录：下面的合并脚本按目录遍历。
          if-no-files-found: warn

      - name: Merge into supported.json
        id: merge
        shell: bash
        # 逻辑放在脚本里而不是内联 `node -e '...'`：内联脚本里既有中文又有
        # 反引号模板字符串，很容易和 shell 的单引号打架（踩过一次）。
        run: node scripts/merge-version-reports.mjs

      - name: Commit
        if: steps.merge.outputs.verified != '0'
        run: |
          set -euo pipefail
          if git diff --quiet -- versions/supported.json; then
            echo "supported.json 没有变化"
            exit 0
          fi
          # 提交者用真实的 bot 身份（ninebird-bot 的 GitHub App），这样
          # commit 上的头像/链接指向应用页，而不是一个编出来的邮箱。
          git config user.name  'ninebird-bot[bot]'
          git config user.email '317614958+ninebird-bot[bot]@users.noreply.github.com'
          git add versions/supported.json
          git commit -m "chore(versions): 登记已验证的 QQ 版本签名兼容性

          由 .github/workflows/qq-version-watch.yml 自动生成。"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
