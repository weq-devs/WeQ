name: Release

# 推送形如 `v0.1.0` 的 tag 触发：分别在 Windows / Linux / macOS 上打包，
# 产物统一发布到同一个 GitHub Release：
#   - Windows: NSIS 安装包 + latest.yml（应用内自动更新读取）
#   - Linux  : AppImage / tar.gz，x64 与 arm64 两个架构
#   - macOS  : dmg + zip（自动更新读取 latest-mac.yml），x64 与 arm64 两个架构
# 最后的 notes job 会用「中文说明 + GitHub 自动生成的 commit 变更列表」
# 覆写 Release 正文，并标注 aarch64 未经真机实测、macOS 产物未签名。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 / 上传 Release

jobs:
  # ========================= QQ 通知门禁 =========================
  # 只有「最后一次 commit」以 Release: / chore(release): 开头时才发 QQ 群通知；
  # 不匹配时仅跳过最后的 qq-notify，构建、发布、Release 说明照常进行。
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check last commit subject
        id: check
        run: |
          MSG=$(git log -1 --pretty=format:%s)
          LOWER=$(printf '%s' "$MSG" | tr '[:upper:]' '[:lower:]')
          case "$LOWER" in
            merge*|release:*|chore\(release\):*)
              echo "release=true"  >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "last subject: $MSG"

  # ============================ Windows ============================
  # Win 专属 NSIS 目标 + 预编译的 native/win32/x64/*.node 都在 Windows 下，
  # 因此在 windows-latest 上构建。此 job 负责建立 Release 并上传 latest.yml。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 把 tag 里的版本号（v1.2.3 -> 1.2.3）写进 package.json，
      # 让 electron-builder 命名产物、app.getVersion() 也能读到。
      - name: Sync version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      # 把 clone-export 机器人引擎打包到 resources/bot-runtime/bot.mjs，
      # 供 electron-builder 一并发布；「导出好友」功能会把它拷进产物。
      - name: Build clone-bot runtime
        run: pnpm run build:bot
      - name: Build ninebird runtime
        run: pnpm run build:ninebird

      # Rust 守护进程二进制 → resources/daemon/<platform>-<arch>/，
      # electron-builder 随 extraResources 打进安装包。
      # runner 镜像预装 Rust 不可靠（windows 上就没有 cargo），显式装一次；
      # 缺工具链时 build:daemon 会直接失败退出。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon binary
        run: pnpm run build:daemon

      - name: Build renderer + main
        run: pnpm --filter @weq/desktop exec electron-vite build

      - name: Prepare release manifest
        run: node scripts/prepare-electron-builder-manifest.mjs

      - name: Swap in release manifest
        shell: pwsh
        run: |
          Move-Item apps/desktop/package.json apps/desktop/package.dev.json
          Move-Item apps/desktop/package.release.json apps/desktop/package.json

      # ---- 诊断转储（无论成功失败都跑）----------------------------
      # electron-builder 从 apps/desktop 运行；这里把它将要读到的
      # 构建输出、manifest、版本号打印出来，方便下次排查
      # "must be under <appDir>" 之类的问题。
      - name: Dump build inputs
        if: always()
        shell: pwsh
        run: |
          # out/ 里混着 pnpm 的 node_modules 链接树，整棵递归一踩就是 MAX_PATH
          # 之外的路径：$ErrorActionPreference=stop 下直接让 job 失败，加
          # SilentlyContinue 又会慢到把 job 挂住。限制深度 + 跳过 node_modules，
          # 只列真正的打包输入。
          Write-Host "== apps/desktop/out (depth 3, no node_modules) ==";
          Get-ChildItem -Recurse -Depth 3 apps/desktop/out -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "== apps/desktop/package.json ==";
          Get-Content apps/desktop/package.json -Raw | Write-Host
          Write-Host "== electron-builder.yml ==";
          Get-Content apps/desktop/electron-builder.yml -Raw | Write-Host

      - name: Package + publish release
        run: pnpm --filter @weq/desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder 在 DEBUG=electron-builder 下很啰嗦；
          # 保留它好让下一次失败（asar / filter / publish）自解释。
          DEBUG: electron-builder

      - name: Restore dev manifest
        if: always()
        shell: pwsh
        run: |
          if (Test-Path apps/desktop/package.dev.json) {
            Remove-Item apps/desktop/package.json -ErrorAction SilentlyContinue
            Move-Item apps/desktop/package.dev.json apps/desktop/package.json
          }
          Remove-Item apps/desktop/package.release.json -ErrorAction SilentlyContinue

      # electron-builder 挂掉时，把它落在磁盘上的东西抓出来，
      # 省得下一轮靠猜。
      - name: Dump release artifacts on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "== release/ tree ==";
          if (Test-Path apps/desktop/release) {
            Get-ChildItem -Recurse apps/desktop/release | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          } else { Write-Host "(no release/ dir)" }
          Write-Host "== win-unpacked/peek ==";
          $p = Join-Path apps/desktop 'release'
          Get-ChildItem -Depth 3 -Path $p -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host

  # ============================ Linux x64 ============================
  # 原生 x64 runner 构建 AppImage / tar.gz。native/linux/x64/*.node 已预编译，
  # sherpa-onnx / resvg 等原生依赖由 pnpm install 自动装 x64 版本。
  # ⚠️ 必须显式传 --x64：electron-builder 的 target.arch 会覆盖 CLI 的架构参数，
  # 而 native binding / daemon 都是构建机架构的，两者一旦不一致就会打出坏包
  # （见 electron-builder.yml 里 linux 一节的说明）。
  linux-x64:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 打包前先把「架构对不对」验掉：resvg / sherpa 的 .node binding 和 cargo
      # 编出来的守护进程都取自构建机。与 macOS 两个 job 同款把关 —— v1.0.0 的
      # weQ-1.0.0-linux-x86_64.AppImage 就是在 arm64 runner 上打出来的，
      # 包里全是 aarch64 binding，启动即 Cannot find module
      # '@resvg/resvg-js-linux-x64-gnu'。
      - name: Verify Node architecture and native bindings
        run: |
          ARCH="$(node -p process.arch)"
          echo "node arch: $ARCH"
          test "$ARCH" = "x64" || { echo "expected x64, got $ARCH"; exit 1; }
          ls -d node_modules/.pnpm/@resvg+resvg-js-linux-x64-gnu@*/node_modules/@resvg/resvg-js-linux-x64-gnu
          ls -d node_modules/.pnpm/sherpa-onnx-linux-x64@*/node_modules/sherpa-onnx-linux-x64

      - name: Sync version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build clone-bot runtime
        run: pnpm run build:bot
      - name: Build ninebird runtime
        run: pnpm run build:ninebird

      # Rust 守护进程二进制 → resources/daemon/<platform>-<arch>/，
      # electron-builder 随 extraResources 打进安装包。
      # runner 镜像预装 Rust 不可靠（windows 上就没有 cargo），显式装一次；
      # 缺工具链时 build:daemon 会直接失败退出。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon binary
        run: pnpm run build:daemon

      # cargo 默认按构建机出二进制，再确认一次它落到了目标架构的目录里。
      - name: Verify daemon binary architecture
        run: |
          file resources/daemon/linux-x64/weq-daemon | grep -q 'x86-64'

      - name: Build renderer + main
        run: pnpm --filter @weq/desktop exec electron-vite build

      - name: Prepare release manifest
        run: node scripts/prepare-electron-builder-manifest.mjs

      - name: Swap in release manifest
        run: |
          mv apps/desktop/package.json apps/desktop/package.dev.json
          mv apps/desktop/package.release.json apps/desktop/package.json

      - name: Package + publish release
        run: pnpm --filter @weq/desktop exec electron-builder --linux --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      # 产物自检：光看构建机架构还不够 —— asar / files 过滤写错一样能让 binding
      # 进不了包。这一步失败就说明 Release 里那份不能要，删掉重打。
      - name: Verify packaged native modules
        run: |
          VERSION="${{ github.ref_name }}"
          APP_DIR="$(ls -d apps/desktop/release/${VERSION#v}/linux*-unpacked | head -1)"
          echo "checking $APP_DIR"
          test -d "$APP_DIR/resources/app.asar.unpacked/node_modules/@resvg/resvg-js-linux-x64-gnu"
          test -d "$APP_DIR/resources/app.asar.unpacked/node_modules/sherpa-onnx-linux-x64"
          file "$APP_DIR/resources/resources/daemon/linux-x64/weq-daemon" | grep -q 'x86-64'

      - name: Restore dev manifest
        if: always()
        run: |
          if [ -f apps/desktop/package.dev.json ]; then
            rm -f apps/desktop/package.json
            mv apps/desktop/package.dev.json apps/desktop/package.json
          fi
          rm -f apps/desktop/package.release.json

      - name: Dump release artifacts on failure
        if: failure()
        run: |
          echo "== release/ tree =="
          ls -laR apps/desktop/release 2>/dev/null || echo "(no release/ dir)"

  # ========================== Linux arm64 ==========================
  # ⚠️ arm64 产物未经真机实测：二进制架构核对无误（native/linux/arm64/*.node
  # 均为 ELF aarch64），但整体是否可用未验证。用原生 arm64 runner
  # （公开仓库免费）构建，让 sherpa-onnx / resvg 装到正确的 arm64 版本。
  linux-arm64:
    needs: [windows]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同 linux-x64：构建机架构必须就是目标架构，否则 resvg / sherpa binding
      # 与守护进程都会是另一个架构的。
      - name: Verify Node architecture and native bindings
        run: |
          ARCH="$(node -p process.arch)"
          echo "node arch: $ARCH"
          test "$ARCH" = "arm64" || { echo "expected arm64, got $ARCH"; exit 1; }
          ls -d node_modules/.pnpm/@resvg+resvg-js-linux-arm64-gnu@*/node_modules/@resvg/resvg-js-linux-arm64-gnu
          ls -d node_modules/.pnpm/sherpa-onnx-linux-arm64@*/node_modules/sherpa-onnx-linux-arm64

      - name: Sync version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build clone-bot runtime
        run: pnpm run build:bot
      - name: Build ninebird runtime
        run: pnpm run build:ninebird

      # Rust 守护进程二进制 → resources/daemon/<platform>-<arch>/，
      # electron-builder 随 extraResources 打进安装包。
      # runner 镜像预装 Rust 不可靠（windows 上就没有 cargo），显式装一次；
      # 缺工具链时 build:daemon 会直接失败退出。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon binary
        run: pnpm run build:daemon

      - name: Verify daemon binary architecture
        run: |
          file resources/daemon/linux-arm64/weq-daemon | grep -q 'aarch64'

      - name: Build renderer + main
        run: pnpm --filter @weq/desktop exec electron-vite build

      - name: Prepare release manifest
        run: node scripts/prepare-electron-builder-manifest.mjs

      - name: Swap in release manifest
        run: |
          mv apps/desktop/package.json apps/desktop/package.dev.json
          mv apps/desktop/package.release.json apps/desktop/package.json

      - name: Package + publish release
        run: pnpm --filter @weq/desktop exec electron-builder --linux --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Verify packaged native modules
        run: |
          VERSION="${{ github.ref_name }}"
          APP_DIR="$(ls -d apps/desktop/release/${VERSION#v}/linux*-unpacked | head -1)"
          echo "checking $APP_DIR"
          test -d "$APP_DIR/resources/app.asar.unpacked/node_modules/@resvg/resvg-js-linux-arm64-gnu"
          test -d "$APP_DIR/resources/app.asar.unpacked/node_modules/sherpa-onnx-linux-arm64"
          file "$APP_DIR/resources/resources/daemon/linux-arm64/weq-daemon" | grep -q 'aarch64'

      - name: Restore dev manifest
        if: always()
        run: |
          if [ -f apps/desktop/package.dev.json ]; then
            rm -f apps/desktop/package.json
            mv apps/desktop/package.dev.json apps/desktop/package.json
          fi
          rm -f apps/desktop/package.release.json

      - name: Dump release artifacts on failure
        if: failure()
        run: |
          echo "== release/ tree =="
          ls -laR apps/desktop/release 2>/dev/null || echo "(no release/ dir)"

  # ========================== macOS x64 (Intel) ==========================
  # 在原生 Intel runner（macos-15-intel；macos-13 已于 2025-12 退役）上构建，
  # 让 sherpa-onnx / resvg 装到 x64 版本，native/darwin/x64 预编译二进制随
  # extraFiles 进包。
  # ⚠️ 未配置 Apple Developer 证书（CSC_LINK / CSC_KEY_PASSWORD）时产物不签名，
  # 首次打开需右键 → 打开；需要签名 / 公证时再补 secrets，这里显式关掉
  # identity 自动发现，避免 electron-builder 在无证书机器上白等。
  macos-x64:
    needs: [windows]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 打包前先确认 Node 架构符合目标，避免再打出「arm64 壳 + x64 binding」
      # 的坏包（v0.4.4 已踩过一次）。
      - name: Verify Node architecture
        run: |
          ARCH="$(node -p process.arch)"
          echo "node arch: $ARCH"
          test "$ARCH" = "x64" || { echo "expected x64, got $ARCH"; exit 1; }

      - name: Sync version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build clone-bot runtime
        run: pnpm run build:bot
      - name: Build ninebird runtime
        run: pnpm run build:ninebird

      # Rust 守护进程二进制 → resources/daemon/<platform>-<arch>/，
      # electron-builder 随 extraResources 打进安装包。
      # runner 镜像预装 Rust 不可靠（windows 上就没有 cargo），显式装一次；
      # 缺工具链时 build:daemon 会直接失败退出。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon binary
        run: pnpm run build:daemon

      - name: Build renderer + main
        run: pnpm --filter @weq/desktop exec electron-vite build

      - name: Prepare release manifest
        run: node scripts/prepare-electron-builder-manifest.mjs

      - name: Swap in release manifest
        run: |
          mv apps/desktop/package.json apps/desktop/package.dev.json
          mv apps/desktop/package.release.json apps/desktop/package.json

      - name: Package + publish release (x64)
        run: pnpm --filter @weq/desktop exec electron-builder --mac --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder

      # macOS 的更新清单不分架构、固定叫 latest-mac.yml，两个架构 job 会互相
      # 覆盖（跑得晚的赢）。先把这份 x64 清单另存为 latest-mac-x64.yml 上传，
      # 交给 mac-merge-update-info 合并（见该 job 的注释）。
      - name: Upload per-arch update manifest
        run: |
          VERSION="${{ github.ref_name }}"
          MANIFEST="apps/desktop/release/${VERSION#v}/latest-mac.yml"
          test -f "$MANIFEST" || { echo "missing $MANIFEST"; exit 1; }
          cp "$MANIFEST" /tmp/latest-mac-x64.yml
          gh release upload "${VERSION}" /tmp/latest-mac-x64.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dev manifest
        if: always()
        run: |
          if [ -f apps/desktop/package.dev.json ]; then
            rm -f apps/desktop/package.json
            mv apps/desktop/package.dev.json apps/desktop/package.json
          fi
          rm -f apps/desktop/package.release.json

      - name: Dump release artifacts on failure
        if: failure()
        run: |
          echo "== release/ tree =="
          ls -laR apps/desktop/release 2>/dev/null || echo "(no release/ dir)"

  # ========================= macOS arm64 (Apple Silicon) =========================
  # 原生 arm64 runner（macos-15，macOS 15 arm64）构建，让 sherpa-onnx / resvg
  # 装到正确的 arm64 版本；native/darwin/arm64 预编译二进制随 extraFiles 进包。
  macos-arm64:
    needs: [windows]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 显式指定架构：macOS arm64 runner 的默认 shell / setup-node 自带
          # 运行时可能以 x64（Rosetta）语义报告 process.arch，导致 pnpm 只装
          # x64 的 native binding（v0.4.4 的 mac-arm64 包缺 resvg arm64 绑定
          # 就是这么来的）。显式传 architecture 让 setup-node 下载目标架构的
          # Node，同时 pnpm store 的缓存 key 也会带上正确架构。
          architecture: arm64
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同上：装完依赖后校验 Node 架构，并确认 arm64 binding 真的进包。
      - name: Verify Node architecture
        run: |
          ARCH="$(node -p process.arch)"
          echo "node arch: $ARCH"
          test "$ARCH" = "arm64" || { echo "expected arm64, got $ARCH"; exit 1; }
          test -d "apps/desktop/node_modules/@resvg/resvg-js-darwin-arm64" || { echo "missing arm64 resvg binding"; exit 1; }

      - name: Sync version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build clone-bot runtime
        run: pnpm run build:bot
      - name: Build ninebird runtime
        run: pnpm run build:ninebird

      # Rust 守护进程二进制 → resources/daemon/<platform>-<arch>/，
      # electron-builder 随 extraResources 打进安装包。
      # runner 镜像预装 Rust 不可靠（windows 上就没有 cargo），显式装一次；
      # 缺工具链时 build:daemon 会直接失败退出。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon binary
        run: pnpm run build:daemon

      - name: Build renderer + main
        run: pnpm --filter @weq/desktop exec electron-vite build

      - name: Prepare release manifest
        run: node scripts/prepare-electron-builder-manifest.mjs

      - name: Swap in release manifest
        run: |
          mv apps/desktop/package.json apps/desktop/package.dev.json
          mv apps/desktop/package.release.json apps/desktop/package.json

      - name: Package + publish release (arm64)
        run: pnpm --filter @weq/desktop exec electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder

      - name: Upload per-arch update manifest
        run: |
          VERSION="${{ github.ref_name }}"
          MANIFEST="apps/desktop/release/${VERSION#v}/latest-mac.yml"
          test -f "$MANIFEST" || { echo "missing $MANIFEST"; exit 1; }
          cp "$MANIFEST" /tmp/latest-mac-arm64.yml
          gh release upload "${VERSION}" /tmp/latest-mac-arm64.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dev manifest
        if: always()
        run: |
          if [ -f apps/desktop/package.dev.json ]; then
            rm -f apps/desktop/package.json
            mv apps/desktop/package.dev.json apps/desktop/package.json
          fi
          rm -f apps/desktop/package.release.json

      - name: Dump release artifacts on failure
        if: failure()
        run: |
          echo "== release/ tree =="
          ls -laR apps/desktop/release 2>/dev/null || echo "(no release/ dir)"

  # ==================== macOS 更新清单合并 ====================
  # macOS 的 electron-builder 更新清单固定叫 latest-mac.yml（不分架构，与
  # Linux 的 latest-linux[-arm64].yml 不同），两个架构 job 各自 publish 会
  # 互相覆盖。这里把两个 job 额外上传的 latest-mac-x64/arm64.yml 合并成一份
  # 同时含两个架构 dmg + zip 的 latest-mac.yml 再回传；否则另一个架构的 app
  # 永远收不到自动更新（MacUpdater 按文件名里有没有 arm64 过滤）。
  mac-merge-update-info:
    needs: [macos-x64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download per-arch update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --pattern "latest-mac-x64.yml" --dir /tmp/mac-update --clobber
          gh release download "${{ github.ref_name }}" \
            --pattern "latest-mac-arm64.yml" --dir /tmp/mac-update --clobber
          ls -la /tmp/mac-update

      - name: Merge into latest-mac.yml
        run: |
          node scripts/merge-mac-update-info.mjs \
            /tmp/mac-update/latest-mac-x64.yml \
            /tmp/mac-update/latest-mac-arm64.yml \
            /tmp/mac-update/latest-mac.yml

      - name: Upload merged manifest & clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" /tmp/mac-update/latest-mac.yml --clobber
          # 合并完成后清掉两个临时清单，别让 Release 资产列表留多余文件。
          gh release delete-asset "${{ github.ref_name }}" latest-mac-x64.yml --yes || true
          gh release delete-asset "${{ github.ref_name }}" latest-mac-arm64.yml --yes || true

  # ============================ Web（浏览器版）============================
  # 每个平台/架构单独产一个 tar.gz：native/、守护进程二进制和 resvg binding
  # 都是平台绑定的，所以不再做「一包通吃」的通用包，改到各自 runner 上构建，
  # 各自只带当前平台的产物。不内置 Node（要求机器上有 Node ≥22）。
  #
  # 依赖 windows job：Release 由 electron-builder --publish 创建，这里只往
  # 已存在的 Release 上传，不自己建。
  web:
    needs: [windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runs-on: windows-latest
            architecture: x64
          - name: Linux x64
            runs-on: ubuntu-latest
            architecture: x64
          - name: Linux arm64
            runs-on: ubuntu-24.04-arm
            architecture: arm64
          - name: macOS Intel (x64)
            runs-on: macos-15-intel
            architecture: x64
          - name: macOS Apple Silicon (arm64)
            runs-on: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runs-on }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.architecture }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与桌面版各平台 job 同款校验：避免 Rosetta / 架构错配导致打包出
      # 「arm64 壳 + x64 binding」的坏包。
      - name: Verify Node architecture
        shell: bash
        run: |
          ARCH="$(node -p process.arch)"
          echo "node arch: $ARCH"
          test "$ARCH" = "${{ matrix.architecture }}" || { echo "expected ${{ matrix.architecture }}, got $ARCH"; exit 1; }

      # 版本号会被 esbuild 烘焙进 server.mjs（设置页显示 + 压缩包命名）。
      - name: Sync version from tag
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      # 先打 NineBird loader 运行时，build-server 才会把它拷进 dist/resources/。
      - name: Build ninebird runtime
        run: pnpm run build:ninebird

      # 浏览器版用户自备 Node，守护进程补上二进制：本 runner 只构建并打进
      # 当前平台那一份（build-server / pack 会按 process.platform/arch 认定）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon binary
        run: pnpm run build:daemon

      # 含 check 守卫：确认没有 Electron 代码泄漏进 web 构建。
      - name: Build + guards
        run: pnpm --filter @weq/web build

      # 把 ws / resvg 预装进 dist/node_modules 一起发布，用户解压即可运行，
      # 不需要联网 npm install。resvg 按平台选 binding，单平台包只装当前那份。
      - name: Install runtime deps into dist/
        run: pnpm --filter @weq/web deps

      # 发布前先启动打包产物验一遍，别把跑不起来的包传上去。
      - name: Smoke-test packaged server
        run: pnpm --filter @weq/web test:dist

      - name: Pack tarball
        run: pnpm --filter @weq/web pack:release ${{ github.ref_name }}

      - name: Upload to release
        shell: bash
        run: gh release upload "${{ github.ref_name }}" apps/web/release/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump build output on failure
        if: failure()
        shell: bash
        run: |
          echo "== apps/web/dist =="
          ls -laR apps/web/dist 2>/dev/null | head -50 || echo "(no dist/)"

  # ======================= Release 说明（中文）=======================
  # 等所有产物都发完（Release 已存在），用「中文说明头 + GitHub 自动
  # 生成的 commit/PR 变更列表」覆写 Release 正文，并标注 aarch64 未实测、
  # macOS 未签名。
  notes:
    needs: [windows, linux-x64, linux-arm64, macos-x64, macos-arm64, mac-merge-update-info, web]
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0：下面的 pre-release 判定要用 merge-base 追 tag 是否落在 dev 上。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tag 打在 dev 分支上时，把这份 Release 标成 pre-release；
      # tag 打在 main（或其它分支）上时保持正式 Release，行为与之前完全一致。
      - name: 若 tag 位于 dev 分支则标记为 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # tag push 时 checkout 在 detached HEAD（即 tag 指向的 commit），
          # 能到达该 commit 就说明这个 tag 是打在 dev 上的。
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev || true
          if git rev-parse --verify -q refs/remotes/origin/dev >/dev/null \
             && git merge-base --is-ancestor HEAD refs/remotes/origin/dev; then
            echo "tag ${TAG} is on dev -> pre-release"
            gh release edit "${TAG}" --repo "${REPO}" --prerelease
          else
            echo "tag ${TAG} is not on dev -> normal release"
          fi

      - name: 生成并写入中文 Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 约定：版本说明的「内容」来自 CHANGELOG.md 对应版本的章节
          # （与 WeQ 助手推文 / 系统通知同一数据源），GitHub 自动生成的
          # commit/PR 变更列表附在后面作为补充。
          SECTION=$(node scripts/extract-changelog.mjs "${TAG}" CHANGELOG.md)

          # 让 GitHub 从上一个 tag 到本 tag 自动生成变更列表（commit/PR）。
          # 只取其中的正文（.body），拼到我们自己的中文说明后面。
          CHANGES=$(gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            --jq '.body')

          NOTES=$(cat <<EOF
          ## weQ ${TAG}

          ### 更新内容
          ${SECTION}

          ### 下载
          - **Windows**: \`weQ-${TAG#v}-setup.exe\`
          - **Linux x64**: \`weQ-${TAG#v}-linux-x86_64.AppImage\` / \`.tar.gz\`
          - **Linux arm64（未实测）**: \`weQ-${TAG#v}-linux-arm64.AppImage\` / \`.tar.gz\`
          - **macOS Intel (x64)**: \`weQ-${TAG#v}-mac-x64.dmg\`（未签名）
          - **macOS Apple Silicon (arm64)**: \`weQ-${TAG#v}-mac-arm64.dmg\`（未签名）
          - **浏览器版 Web**（需自备 Node ≥22，每平台一个压缩包，按运行机器选）：
            - Windows x64: \`weq-web-${TAG#v}-win32-x64.tar.gz\`
            - Linux x64: \`weq-web-${TAG#v}-linux-x64.tar.gz\`
            - Linux arm64: \`weq-web-${TAG#v}-linux-arm64.tar.gz\`
            - macOS Intel (x64): \`weq-web-${TAG#v}-darwin-x64.tar.gz\`
            - macOS Apple Silicon (arm64): \`weq-web-${TAG#v}-darwin-arm64.tar.gz\`
            每个包自带对应平台的 native 原生模块与 Rust 守护进程二进制，
            详见[使用说明](https://github.com/${REPO}/blob/main/apps/web/README.md)

          ### 变更
          ${CHANGES}
          EOF
          )

          # 覆写 Release 正文（electron-builder 建 Release 时写的默认正文会被替换）。
          gh release edit "${TAG}" --repo "${REPO}" --notes "${NOTES}"

  # ========================== QQ 群通知 ==========================
  # 等所有产物和 Release 说明都完成后，发送 QQ 群通知。
  # 消息内容取最后一次 commit 正文（用户约定在此写本次更新说明）。
  # 只发 Windows x86_64 的 desktop 安装包：先把 exe 压成压缩包，
  # 再按压缩包大小做 200 MB 检查；通过后压缩包经分块上传直传 QQ
  #（GitHub CDN 在大陆不可访问）。裸 exe 不再直发。
  qq-notify:
    needs: [notes, gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release info & package desktop installer
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          EXE="weQ-${VER}-setup.exe"
          PKG="weQ-${VER}-win32-x64-setup.7z"
          EXE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${EXE}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}"
          LINUX_X64_URL="${BASE_URL}/weQ-${VER}-linux-x86_64.AppImage"
          LINUX_ARM64_URL="${BASE_URL}/weQ-${VER}-linux-arm64.AppImage"
          MAC_X64_URL="${BASE_URL}/weQ-${VER}-mac-x64.dmg"
          MAC_ARM64_URL="${BASE_URL}/weQ-${VER}-mac-arm64.dmg"
          WEB_WIN_X64_URL="${BASE_URL}/weq-web-${VER}-win32-x64.tar.gz"
          WEB_LINUX_X64_URL="${BASE_URL}/weq-web-${VER}-linux-x64.tar.gz"
          WEB_LINUX_ARM64_URL="${BASE_URL}/weq-web-${VER}-linux-arm64.tar.gz"
          WEB_DARWIN_X64_URL="${BASE_URL}/weq-web-${VER}-darwin-x64.tar.gz"
          WEB_DARWIN_ARM64_URL="${BASE_URL}/weq-web-${VER}-darwin-arm64.tar.gz"

          gh release download "${VERSION}" --pattern "${EXE}" --dir /tmp/release

          # 先压缩：QQ 只发压缩包，不发 exe 裸文件。
          # 7z 不保证预装在 runner 上，缺了就装一次。
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          7z a -t7z -mx=9 -mmt=on "/tmp/release/${PKG}" "/tmp/release/${EXE}" >/dev/null

          # 约定：QQ 通知的「详细更改」取 CHANGELOG.md 对应版本章节
          # （与 WeQ 助手推文 / Release 说明同一数据源）。
          BODY=$(node scripts/extract-changelog.mjs "${VERSION}" CHANGELOG.md)

          # 检查「压缩后」的大小，超过 200 MB 则不作为附件发送（QQ 限制）
          PKG_SIZE=$(stat -c%s "/tmp/release/${PKG}")
          if [ "$PKG_SIZE" -lt $((200 * 1024 * 1024)) ]; then
            echo "send_file=true"  >> $GITHUB_OUTPUT
          else
            echo "send_file=false" >> $GITHUB_OUTPUT
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "exe=${EXE}"         >> $GITHUB_OUTPUT
          echo "pkg=${PKG}"         >> $GITHUB_OUTPUT
          echo "exe_url=${EXE_URL}"             >> $GITHUB_OUTPUT
          echo "linux_x64_url=${LINUX_X64_URL}" >> $GITHUB_OUTPUT
          echo "linux_arm64_url=${LINUX_ARM64_URL}" >> $GITHUB_OUTPUT
          echo "mac_x64_url=${MAC_X64_URL}" >> $GITHUB_OUTPUT
          echo "mac_arm64_url=${MAC_ARM64_URL}" >> $GITHUB_OUTPUT
          echo "web_win_x64_url=${WEB_WIN_X64_URL}"     >> $GITHUB_OUTPUT
          echo "web_linux_x64_url=${WEB_LINUX_X64_URL}" >> $GITHUB_OUTPUT
          echo "web_linux_arm64_url=${WEB_LINUX_ARM64_URL}" >> $GITHUB_OUTPUT
          echo "web_darwin_x64_url=${WEB_DARWIN_X64_URL}" >> $GITHUB_OUTPUT
          echo "web_darwin_arm64_url=${WEB_DARWIN_ARM64_URL}" >> $GITHUB_OUTPUT
          { echo "body<<BODY_EOF"; echo "$BODY"; echo "BODY_EOF"; } >> $GITHUB_OUTPUT

      - name: Send QQ notification (with package)
        if: steps.prep.outputs.send_file == 'true'
        uses: H3CoF6/qq-notify-action@main
        with:
          appid: ${{ secrets.QQ_APPID }}
          secret: ${{ secrets.QQ_SECRET }}
          group_openid: ${{ secrets.QQ_GROUP_OPENID }}
          message: |
            ## WeQ 新版本 ${{ steps.prep.outputs.version }} 发布

            详细更改如下：
            ${{ steps.prep.outputs.body }}

            ---

            - Windows x86_64 安装包[下载链接](${{ steps.prep.outputs.exe_url }})
            - Linux x64 AppImage [下载链接](${{ steps.prep.outputs.linux_x64_url }})
            - Linux arm64 AppImage [下载链接](${{ steps.prep.outputs.linux_arm64_url }})
            - macOS Intel dmg [下载链接](${{ steps.prep.outputs.mac_x64_url }})
            - macOS Apple Silicon dmg [下载链接](${{ steps.prep.outputs.mac_arm64_url }})
            - 浏览器版 Web：
              Windows x64 [下载链接](${{ steps.prep.outputs.web_win_x64_url }}) 

            **欢迎大家测试使用新的功能喵~**
          file_path: /tmp/release/${{ steps.prep.outputs.pkg }}
          file_type: file
          file_name: ${{ steps.prep.outputs.pkg }}

      - name: Send QQ notification (package too large, link only)
        if: steps.prep.outputs.send_file == 'false'
        uses: H3CoF6/qq-notify-action@main
        with:
          appid: ${{ secrets.QQ_APPID }}
          secret: ${{ secrets.QQ_SECRET }}
          group_openid: ${{ secrets.QQ_GROUP_OPENID }}
          message: |
            ## WeQ 新版本 ${{ steps.prep.outputs.version }} 发布

            详细更改如下：
            ${{ steps.prep.outputs.body }}

            ---

            - Windows x86_64 安装包 [下载链接](${{ steps.prep.outputs.exe_url }})
            - Linux x64 AppImage [下载链接](${{ steps.prep.outputs.linux_x64_url }})
            - Linux arm64 AppImage [下载链接](${{ steps.prep.outputs.linux_arm64_url }})
            - macOS Intel dmg [下载链接](${{ steps.prep.outputs.mac_x64_url }})
            - macOS Apple Silicon dmg [下载链接](${{ steps.prep.outputs.mac_arm64_url }})
            - 浏览器版 Web：
              Windows x64 [下载链接](${{ steps.prep.outputs.web_win_x64_url }}) 

            **安装包体积超过上限了喵**
            **欢迎大家测试使用新的功能喵~**
