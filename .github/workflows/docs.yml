name: Docs

# 文档站的构建与部署在 `weq-devs/WeqDocs` 自己的 CI 里，不在这个仓库。
#
# 这里只做两件事：
#   1. **确认 submodule 指针指向的是已推送的提交** —— 忘记推 docs 仓就提交指针，
#      会让别人 clone 后 submodule 拉取失败。这是最常见的 submodule 事故，
#      检查成本很低，值得每次都跑。
#   2. 确认公开内容里没有真实账号信息。
#
# 和 ci.yml 完全独立：ci.yml 被 release.yml 复用，是发版门禁，不该被文档牵连。

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pointer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pointer:
    name: submodule pointer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Verify docs submodule commit is pushed
        run: node scripts/check-docs-submodule.mjs

      - name: Initialize verified docs submodule
        run: git submodule update --init --recursive docs

      - name: Anonymization check
        # 只扫当前版本。历史不在范围内 —— 主仓一直公开，这些内容在历史里早已可查，
        # 单独洗 docs 仓的历史没有意义。
        run: node scripts/anonymize-docs.mjs --check
