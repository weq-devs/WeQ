name: CI

# Lint + type-check gate for every push / PR onto the long-lived branches.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer commit on the same ref supersedes in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # warning 也算失败：存量告警已清零 / 豁免，新增的必须当场处理。
      - name: Lint
        run: pnpm lint

      # 格式统一由 biome 一把抓：未按 biome.json 规范格式化的代码在此即失败，
      # 本地用 `pnpm format` 一次性刷平即可。
      - name: Format check
        run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    env:
      # tsc only needs the type defs, not the Electron binary — skip the ~100 MB
      # download to keep installs fast.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm -r typecheck

  # 离线单测（packages/*/test/*.test.ts）。需要真 QQ 环境的探针脚本在
  # packages/*/tools/ 下，不在这里跑 —— 约定见 docs/develop/testing.md。
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:fail-fast

  # 浏览器版打包冒烟（linux-x64）：native/ 随包 → 两个守卫 →
  # 启动真实产物走一遍鉴权流程。产物现在按平台/架构各自成包，build-web 冒烟
  # 的就是 release web 矩阵里 linux-x64 那一条。
  # 守卫防的是同一类回归：Electron-only 的代码混进 web 构建后不会报错，
  # 只在运行时炸成一句看不懂的 "does not provide an export named 'app'"。
  build-web:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build-server 会把 native/<platform>/<arch>/ 拷进 dist，而 nt_helper.node
      # 不入库 —— 与 release 的 web 矩阵一样，打包前先取当前平台那一份。
      - name: Fetch nt_helper native artifacts
        run: node scripts/fetch-native.mjs --require-fresh --verify

      # build 内含 check：check-electron-free（走真实 import 图）
      # + check-bundle（扫前端产物里残留的自定义协议 URL）。
      - name: Build + guards
        run: pnpm --filter @weq/web build

      # 启动打包好的 server.mjs 走一遍完整流程 —— 覆盖 esbuild 的 CJS 互操作
      # 和原生模块解析，这些只有真跑起来才会暴露。
      - name: Smoke-test packaged server
        run: pnpm --filter @weq/web test:dist
