name: CI

# push/PR 与 Release 共用的 lint、类型、测试和 Web 构建门禁。
on:
  workflow_call:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer commit on the same ref supersedes in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # warning 也算失败：存量告警已清零 / 豁免，新增的必须当场处理。
      - name: Lint
        run: pnpm lint

      # 格式统一由 biome 一把抓：未按 biome.json 规范格式化的代码在此即失败，
      # 本地用 `pnpm format` 一次性刷平即可。
      - name: Format check
        run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    env:
      # tsc only needs the type defs, not the Electron binary — skip the ~100 MB
      # download to keep installs fast.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm -r typecheck

  # 大包按 Vitest 原生分片并行，保留逐文件隔离和完整测试范围。
  # 不在同一 runner 内叠加包并发；各片失败也继续收集其余片的结果。
  test-suites:
    name: test-${{ matrix.suite }}-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: desktop, shard: '1/6' }
          - { suite: desktop, shard: '2/6' }
          - { suite: desktop, shard: '3/6' }
          - { suite: desktop, shard: '4/6' }
          - { suite: desktop, shard: '5/6' }
          - { suite: desktop, shard: '6/6' }
          - { suite: service, shard: '1/2' }
          - { suite: service, shard: '2/2' }
          - { suite: core, shard: all }
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop or service shard
        if: matrix.suite != 'core'
        run: >-
          pnpm --filter @weq/${{ matrix.suite }} test
          --shard=${{ matrix.shard }} --maxWorkers=2 --minWorkers=1
          --reporter=default --reporter=json --outputFile=${{ runner.temp }}/test-results.json

      - name: Run remaining packages and Web assertions
        if: matrix.suite == 'core'
        run: >-
          pnpm -r --filter '!@weq/desktop' --filter '!@weq/service'
          --no-sort --no-bail --workspace-concurrency=2 test --maxWorkers=2 --minWorkers=1

      - name: Check CI orchestration and reports
        if: matrix.suite == 'core'
        run: node --test scripts/test-ci.test.mjs scripts/release-notes.test.mjs scripts/publish-aur.test.mjs

      - name: Summarize test results
        if: always() && matrix.suite != 'core'
        run: node scripts/test-summary.mjs "${{ runner.temp }}/test-results.json"

      - name: Preserve test results
        if: always() && matrix.suite != 'core'
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.suite }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-results.json
          retention-days: 7
          if-no-files-found: warn

  # 保留稳定的 test 门禁名称；失败、取消或意外跳过均不能冒充通过。
  test:
    if: always()
    needs: [test-suites]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test suite
        env:
          RESULT: ${{ needs.test-suites.result }}
        run: test "$RESULT" = success

  # 浏览器版打包冒烟（linux-x64）：native/ 随包 → 两个守卫 →
  # 启动真实产物走一遍鉴权流程。产物现在按平台/架构各自成包，build-web 冒烟
  # 的就是 release web 矩阵里 linux-x64 那一条。
  # 守卫防的是同一类回归：Electron-only 的代码混进 web 构建后不会报错，
  # 只在运行时炸成一句看不懂的 "does not provide an export named 'app'"。
  build-web:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build-server 会把 native/<platform>/<arch>/ 拷进 dist，而 nt_helper.node
      # 不入库 —— 与 release 的 web 矩阵一样，打包前先取当前平台那一份。
      - name: Fetch nt_helper native artifacts
        run: node scripts/fetch-native.mjs --require-fresh --verify

      # build 内含 check：check-electron-free（走真实 import 图）
      # + check-bundle（扫前端产物里残留的自定义协议 URL）。
      - name: Build + guards
        run: pnpm --filter @weq/web build

      # 启动打包好的 server.mjs 走一遍完整流程 —— 覆盖 esbuild 的 CJS 互操作
      # 和原生模块解析，这些只有真跑起来才会暴露。
      - name: Smoke-test packaged server
        run: pnpm --filter @weq/web test:dist
