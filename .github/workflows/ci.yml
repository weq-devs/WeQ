name: CI

# Lint + type-check gate for every push / PR onto the long-lived branches.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer commit on the same ref supersedes in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # warning 也算失败：存量告警已清零 / 豁免，新增的必须当场处理。
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      # tsc only needs the type defs, not the Electron binary — skip the ~100 MB
      # download to keep installs fast.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm -r typecheck

  # 离线单测（packages/*/test/*.test.ts）。需要真 QQ 环境的探针脚本在
  # packages/*/tools/ 下，不在这里跑 —— 约定见 docs/develop/testing.md。
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm -r test

  # Linux 打包冒烟：只构建、不发布（--dir），在 PR 阶段就能发现
  # Linux 打包链路（electron-vite build + electron-builder）挂没挂。
  # 只跑 x64 足以覆盖配置正确性；arm64 交给 release 时的原生 runner。
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build clone-bot runtime
        run: pnpm run build:bot

      - name: Build ninebird runtime
        run: pnpm run build:ninebird

      - name: Build renderer + main
        run: pnpm --filter @weq/desktop exec electron-vite build

      - name: Prepare release manifest
        run: node scripts/prepare-electron-builder-manifest.mjs

      - name: Swap in release manifest
        run: |
          mv apps/desktop/package.json apps/desktop/package.dev.json
          mv apps/desktop/package.release.json apps/desktop/package.json

      # --dir：只解包到 release/，不产出安装包、不发布。验证打包能跑通即可。
      - name: Package (dir only, no publish)
        run: pnpm --filter @weq/desktop exec electron-builder --linux --dir

      - name: Restore dev manifest
        if: always()
        run: |
          if [ -f apps/desktop/package.dev.json ]; then
            rm -f apps/desktop/package.json
            mv apps/desktop/package.dev.json apps/desktop/package.json
          fi
          rm -f apps/desktop/package.release.json

  # 浏览器版打包冒烟：构建 → 两个守卫 → 启动真实产物走一遍鉴权流程。
  # 守卫防的是同一类回归：Electron-only 的代码混进 web 构建后不会报错，
  # 只在运行时炸成一句看不懂的 "does not provide an export named 'app'"。
  build-web:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 鉴权闸 + 端到端路由测试。不需要构建产物，先跑、失败得早。
      - name: Test auth gate
        run: pnpm --filter @weq/web test

      # 先打 NineBird loader 运行时，build-server 才会把它拷进 dist/resources/。
      - name: Build ninebird runtime
        run: pnpm run build:ninebird

      # build 内含 check：check-electron-free（走真实 import 图）
      # + check-bundle（扫前端产物里残留的自定义协议 URL）。
      - name: Build + guards
        run: pnpm --filter @weq/web build

      # 启动打包好的 server.mjs 走一遍完整流程 —— 覆盖 esbuild 的 CJS 互操作
      # 和原生模块解析，这些只有真跑起来才会暴露。
      - name: Smoke-test packaged server
        run: pnpm --filter @weq/web test:dist
