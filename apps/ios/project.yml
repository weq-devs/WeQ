name: WeQRemote
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  WeQRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Support/Tailscale-LICENSE.txt
        buildPhase: resources
    dependencies:
      - framework: ${WEQ_TAILSCALE_FRAMEWORK}
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.wata4me.weq.remote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: WeQ Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  WeQRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WeQRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WeQRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WeQRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WeQRemote:
    build:
      targets:
        WeQRemote: all
        WeQRemoteTests: [test]
        WeQRemoteUITests: [test]
    test:
      targets: [WeQRemoteTests, WeQRemoteUITests]
