appId: app.weq.desktop
productName: weQ
copyright: Copyright © 2026 weQ contributors
directories:
  output: release/${version}
  buildResources: build
files:
  - "out/**/*"
  - "!out/main/qqKernelRegistration.node"
  # Bare "package.json" was being resolved as a glob in this monorepo and
  # matched `../../packages/<name>/package.json` etc., which electron-builder
  # rejects ("must be under <appDir>"). Pin to the desktop app's own manifest.
  - "./package.json"
  # Keep runtime deps from this app's node_modules so bundled code can resolve
  # bare imports like `@electron-toolkit/utils` after installation.
  # Workspace packages are removed from the release manifest before packaging.
  - "node_modules/**/*"
  - "!node_modules/@weq/**/*"
  # onnxruntime-node 是原生模块：留在 asar 里会被 electron-builder 的 smartUnpack
  # **整包**解出一份到 app.asar.unpacked/（288 MB 的包体，2.0.5 的 Windows 安装包
  # 因此直接翻倍）。运行时真正加载的是下面 extraResources 拷到 <resources>/node_modules/
  # 的那份 —— fork 出去的 ocrWorker.mjs 从 <resources>/out/main/ 起跑，node 的模块解析
  # 只会顺着目录往上撞到 <resources>/node_modules，永远拐不进 app.asar.unpacked。
  # 所以整包从 asar 里剔掉。
  - "!node_modules/onnxruntime-node/**"
extraResources:
  - from: ../../LICENSE
    to: ../LICENSE

  # Shared static assets (brand/logo, …). Copied whole so the main process can
  # read them at runtime via process.resourcesPath/resources. QQ emoji are NOT
  # bundled — they stream from the account's QQ NT dir at runtime.
  #
  # 例外：**Windows 不带打包的 CJK 字体**。`assistant/fonts/cover.otf` 是
  # 16MB 的 Noto Sans CJK SC（satori 出 WeQ 助手推文封面用），而 Win10/11 自带
  # DengXian(`Deng.ttf`) / SimHei，`weq_assistant/cover.ts` 的字体候选会自然
  # 回落到它们，封面照常渲染。mac / linux 没有这么可靠的单字体文件（macOS 全是
  # satori 读不了的 .ttc），所以在下面各自把 fonts/ 补回来。
  # 注：平台段（win/mac/linux）的 extraResources 与这里是**追加**关系
  #（app-builder-lib 的 getFileMatchers 依次 copy），负向 filter 删不掉已拷进来的
  # 文件，所以「默认不含 + 需要者补回」而不是「默认含 + Windows 排除」。
  #
  # `brand/banner.png`（2.2MB）同样不打包 —— 它只是 README 首图（仓库里除
  # README.md 外无引用），所有平台的应用都不读它。
  - from: ../../resources
    to: resources
    filter:
      - "**/*"
      - "!assistant/fonts/**"
      - "!brand/banner.png"

  - from: node_modules/sherpa-onnx-node
    to: node_modules/sherpa-onnx-node

  - from: out/main/transcribeWorker.mjs
    to: out/main/transcribeWorker.mjs

  - from: out/main/attachWorker.mjs
    to: out/main/attachWorker.mjs

  # 本地 OCR 的推理 worker 同理（见 main/ocr/worker.ts）：fork 出去的子进程读不了
  # asar 里的文件，所以单独拷一份到 <resources>/out/main/。它是自包含的单文件
  # （rollup 已把管线打进这个 chunk，没有相对 import），拷一个文件就够。
  #
  # 推理引擎 onnxruntime-node 的原生绑定也得在 asar 外面：worker 从
  # <resources>/out/main/ 跑起来，模块解析顺着目录往上撞到 <resources>/node_modules/。
  # 但**不能**在这里整包拷 —— 这个包本身 288 MB，里面装着三个平台 × 两个架构的 CPU
  # 二进制（win32 134 MB / darwin 86 MB / linux 69 MB，其中 darwin 还自带一份重复的
  # dylib），而本次构建的平台只用得到其中一份。所以按平台 / 架构分开挑：条目写在下面
  # win / mac / linux 各自的 `extraResources` 里（filter 里的 pattern 同样会过
  # app-builder-lib 的 macroExpander，`${arch}` 会展开），各平台与 `@weq/service` 的
  # `localOcrBlocker()` 用的是同一份二进制矩阵。
  #
  # onnxruntime-common 是纯 JS（~1 MB）且三个平台一样，留在这里一份就够。
  - from: out/main/ocrWorker.mjs
    to: out/main/ocrWorker.mjs
  - from: out/main/qqKernelWorker.mjs
    to: out/main/qqKernelWorker.mjs
  - from: node_modules/onnxruntime-common
    to: node_modules/onnxruntime-common

asarUnpack:
  # @resvg/resvg-js loads a platform .node binding (used by the WeQ 助手 cover
  # renderer in the main process). Native addons can't be loaded from inside the
  # asar, so unpack the resvg packages (base + per-platform binding). The
  # darwin bindings (x64 + arm64) are declared as direct deps of the desktop
  # app and both get unpacked here; js-binding.js picks whichever matches
  # process.arch at runtime, so the packaging no longer depends on the build
  # runner's own architecture.
  - node_modules/@resvg/**/*
  # # The voice-transcription worker is forked as a child process (can't run from
  # # inside the asar) and loads the native sherpa-onnx binding from node_modules.
  # - out/main/transcribeWorker.mjs

win:
  icon: ../../resources/brand/logo.png
  # native (.node) files live outside the source tree and are bundled at
  # package time, into the install root (NOT resources/) so the layout is
  # `<install>/native/<platform>/<arch>/…` — matching what the loader resolves
  # from process.platform/process.arch. Written per-platform because the
  # `${os}` macro expands to electron-builder's key ("win"/"linux"), not to
  # node's process.platform ("win32"/"linux").
  extraFiles:
    - from: ../../native/win32/x64
      to: native/win32/x64
  # 本地 OCR 的推理引擎：只带本次构建的架构那一份（见顶部 extraResources 的说明）。
  # `script/` 只在 postinstall 用得上，不带。
  extraResources:
    - from: node_modules/onnxruntime-node
      to: node_modules/onnxruntime-node
      filter:
        - package.json
        - README.md
        - dist/**
        - lib/**
        - bin/napi-v6/win32/${arch}/**
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  # 卸载钩子在 buildResources/installer.nsh（electron-builder 按约定自动 include，
  # 不要同时用 nsis.include 指一遍 —— 那样宏会重复定义）。那里负责停掉 weq-daemon、
  # 删掉它的开机自启任务与数据目录：electron 的卸载器不认识 %LOCALAPPDATA%\weq-daemon。

# Linux 目标：AppImage（单文件免安装，最通用）+ tar.gz（解压即用）。
# 架构由命令行决定：CI 里每个 runner 只打自己那一种（linux-x64 → --x64，
# linux-arm64 → --arm64），native/ 二进制通过下面的 extraFiles 按 ${arch}
# 自动挑对应架构（linux/x64 或 linux/arm64）。arm64 未经真机实测。
#
# ⚠️ 不要给 target 加 `arch: [x64, arm64]`：electron-builder 的 target.arch 会
# 覆盖 CLI 的 --x64 / --arm64（app-builder-lib computeArchToTargetNamesMap），
# 一次构建就会把两种架构都打出来；而 pnpm 装的 native binding
# （@resvg/resvg-js-linux-*-gnu、sherpa-onnx-linux-*）和 cargo 编出来的
# resources/daemon/<platform>-<arch> 全是**构建机架构**的，于是非构建机架构的
# 包会带着错误架构的原生模块出厂：v1.0.0 的 weQ-1.0.0-linux-x86_64.AppImage
# 就是这么坏的 —— 在 arm64 runner 上打出来，包里是 aarch64 binding，启动即
# Cannot find module '@resvg/resvg-js-linux-x64-gnu'。
linux:
  icon: ../../resources/brand/logo.png
  # Wayland 会话默认走 XWayland：平铺合成器（Hyprland/sway）会把 `type: 'toolbar'`
  # 当成普通平铺窗口，且可能忽略程序化改尺寸。这个开关必须出现在 Electron 启动参数里
  # ——`app.commandLine.appendSwitch` 在 ready 前调用也来不及（详见
  # apps/desktop/src/main/linux_window_backend.ts）。用户可用 WEQ_OZONE_PLATFORM=wayland
  # 显式退回原生 Wayland；纯 X11 桌面上多传这个参数无害。
  executableArgs:
    - --ozone-platform=x11
  # 打包字体（见顶部 extraResources 的说明）：Linux 发行版未必装 Noto CJK。
  extraResources:
    - from: ../../resources/assistant/fonts
      to: resources/assistant/fonts
    # 本地 OCR 的推理引擎：只带 linux/${arch} 那份（见顶部 extraResources 的说明）。
    - from: node_modules/onnxruntime-node
      to: node_modules/onnxruntime-node
      filter:
        - package.json
        - README.md
        - dist/**
        - lib/**
        - bin/napi-v6/linux/${arch}/**
  extraFiles:
    - from: ../../native/linux/${arch}
      to: native/linux/${arch}
  target:
    - target: AppImage
    - target: tar.gz
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Network

# macOS 目标：dmg（手动安装）+ zip（Squirrel.Mac 自动更新必需 ——
# electron-updater 的 MacUpdater 只认 zip，仅 dmg 会报 "ZIP file not
# provided"）。架构同样交给命令行（macos-x64 → --x64，macos-arm64 → --arm64；
# 理由与 linux 一节相同：target.arch 会覆盖 CLI，另一架构的包会带上构建机的
# native 模块）。native/ 二进制与 win/linux 一样在打包时
# 拷到安装根目录的 native/<platform>/<arch>，与加载器按 process.arch 解析的
# 约定一致（darwin/x64 与 darwin/arm64，见 packages/native/src/loader.ts）。
# macOS 没有注入型 dll/so（SIP），darwin/ 下只有 nt_helper.node——快登 /
# 扫码走纯协议，不再需要任何注入或沙箱容器文件。
# 未配置 CSC_LINK / CSC_KEY_PASSWORD secrets 时产物不签名（Gatekeeper 会拦，
# 首次需右键 → 打开）；配置后 electron-builder 会自动签名，可再开 notarize。
mac:
  icon: ../../resources/brand/logo.png
  # 打包字体（见顶部 extraResources 的说明）：macOS 的候选全是 .ttc，satori 读不了。
  extraResources:
    - from: out/main/qqKernelRegistration.node
      to: out/main/qqKernelRegistration.node
    - from: ../../resources/assistant/fonts
      to: resources/assistant/fonts
    # 本地 OCR 的推理引擎：只带 darwin/${arch} 那份（见顶部 extraResources 的说明）。
    # ⚠️ 上游**没有** darwin/x64（Intel Mac）的二进制，所以 mac-x64 这个 filter 一个文件
    # 都匹配不到 —— 那台机器上本地识别本来就跑不起来，`localOcrBlocker()` 会在
    # 设置页 / 灯箱 / MCP 三处如实说明，不再引导用户去下一个用不了的模型。
    - from: node_modules/onnxruntime-node
      to: node_modules/onnxruntime-node
      filter:
        - package.json
        - README.md
        - dist/**
        - lib/**
        - bin/napi-v6/darwin/${arch}/**
  extraFiles:
    - from: ../../native/darwin/${arch}
      to: native/darwin/${arch}
  target:
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.social-networking

# GitHub publish target for `electron-builder --publish always` (Release workflow).
# Generates + uploads latest.yml / *.blockmap that the in-app updater reads.
# releaseType: release => the Release is published (not a draft) and marked latest.
publish:
  provider: github
  owner: H3CoF6
  repo: WeQ
  releaseType: release
