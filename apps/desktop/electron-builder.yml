appId: app.weq.desktop
productName: weQ
electronLanguages:
  - en-US
  - en-GB
  - zh-CN
  - zh-TW
copyright: Copyright © 2026 weQ contributors
directories:
  output: release/${version}
  buildResources: build
beforePack: ../../scripts/prepare-desktop-package.mjs
afterPack: ../../scripts/trim-desktop-package.mjs
afterSign: ../../scripts/verify-desktop-authorization.mjs
files:
  - "out/**/*"
  - "!out/types-*/**"
  - "!out/**/*.d.{ts,cts,mts}"
  # Bare "package.json" was being resolved as a glob in this monorepo and
  # matched `../../packages/<name>/package.json` etc., which electron-builder
  # rejects ("must be under <appDir>"). Pin to the desktop app's own manifest.
  - "./package.json"
  # Keep runtime deps from this app's node_modules so bundled code can resolve
  # bare imports like `@electron-toolkit/utils` after installation.
  # Workspace packages are removed from the release manifest before packaging.
  - "node_modules/**/*"
  - "!node_modules/@weq/**/*"
  # 前端依赖仅用于构建；运行依赖也不携带源码映射和 ExcelJS 的浏览器整包。
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.{ts,cts,mts}"
  - "!node_modules/exceljs/dist/**"
  # 专用引擎单独生成增强资产，基础应用只带固定清单。
  - "!node_modules/onnxruntime-node/**"
  - "!node_modules/onnxruntime-common/**"
  - "!node_modules/sherpa-onnx-*/**"
  - "!node_modules/@receptron/laya/**"
  - "!node_modules/@huggingface/tokenizers/**"
extraResources:
  - from: out/main/analysisReportsWorker.mjs
    to: out/main/analysisReportsWorker.mjs
  - from: out/main/imageWorker.mjs
    to: out/main/imageWorker.mjs
  - from: out/main/coverWorker.mjs
    to: out/main/coverWorker.mjs
  - from: out/main/backupProbeWorker.mjs
    to: out/main/backupProbeWorker.mjs
  - from: out/main/dbCheckupWorker.mjs
    to: out/main/dbCheckupWorker.mjs
  - from: out/main/storageCleanupWorker.mjs
    to: out/main/storageCleanupWorker.mjs
  # 独立清除助手与主进程共享纯文件系统模块；子进程不能从 asar 里解析相邻 chunks。
  - from: out/main/chunks
    to: out/main/chunks
  - from: ../web/dist/public
    to: remote-web
  - from: ../../tools/remote-network/build/${os}/${arch}
    to: remote-network
    filter:
      - weq-remote-network
      - weq-remote-network.exe
  # Shared static assets (brand/logo, …). Copied whole so the main process can
  # read them at runtime via process.resourcesPath/resources. QQ emoji are NOT
  # bundled — they stream from the account's QQ NT dir at runtime.
  #
  # 例外：**Windows 不带打包的 CJK 字体**。`assistant/fonts/cover.otf` 是
  # 16MB 的 Noto Sans CJK SC（satori 出 WeQ 助手推文封面用），而 Win10/11 自带
  # DengXian(`Deng.ttf`) / SimHei，`weq_assistant/cover.ts` 的字体候选会自然
  # 回落到它们，封面照常渲染。mac / linux 没有这么可靠的单字体文件（macOS 全是
  # satori 读不了的 .ttc），所以在下面各自把 fonts/ 补回来。
  # 注：平台段（win/mac/linux）的 extraResources 与这里是**追加**关系
  #（app-builder-lib 的 getFileMatchers 依次 copy），负向 filter 删不掉已拷进来的
  # 文件，所以「默认不含 + 需要者补回」而不是「默认含 + Windows 排除」。
  #
  # `brand/banner.png`（2.2MB）同样不打包 —— 它只是 README 首图（仓库里除
  # README.md 外无引用），所有平台的应用都不读它。
  - from: ../../resources
    to: resources
    filter:
      - "**/*"
      - "!assistant/fonts/**"
      - "!brand/banner.png"
      - "!daemon/**"
      - "!dress/*.dat"
      - "!dress/*_resources"
      - "!dress/fetch-state.json"

  - from: out/main/transcribeWorker.mjs
    to: out/main/transcribeWorker.mjs

  - from: out/main/attachWorker.mjs
    to: out/main/attachWorker.mjs

  - from: out/main/intentSenseWorker.mjs
    to: out/main/intentSenseWorker.mjs

  - from: out/main/ocrWorker.mjs
    to: out/main/ocrWorker.mjs

asarUnpack:
  - node_modules/sharp/**/*
  # sharp 的 libvips 动态库必须显式解包：smartUnpack 只认 `.so` / `.dll` / `.dylib`
  # / `.node` 结尾的文件，而 Linux 的库是带版本号的 `libvips-cpp.so.8.18.7`，
  # 留在 asar 里 dlopen 会报 "libvips-cpp.so.8.18.7: 无法打开共享目标文件"（2.5.3
  # 的 Linux AppImage 启动即崩在这里）。开头的 `**/` 不能省：pnpm 把包放在
  # `node_modules/.pnpm/<pkg>@<ver>/node_modules/<pkg>`，electron-builder 传给
  # asarUnpack 的路径是这一串，不带 `**/` 的 `node_modules/@img/**/*` 匹配不到。
  - "**/node_modules/@img/**/*"
  # resvg 原生绑定在 asar 外加载；afterPack 移除非目标 Darwin 架构。
  - node_modules/@resvg/**/*

win:
  icon: ../../resources/brand/logo.png
  # native (.node) files live outside the source tree and are bundled at
  # package time, into the install root (NOT resources/) so the layout is
  # `<install>/native/<platform>/<arch>/…` — matching what the loader resolves
  # from process.platform/process.arch. Written per-platform because the
  # `${os}` macro expands to electron-builder's key ("win"/"linux"), not to
  # node's process.platform ("win32"/"linux").
  extraFiles:
    - from: ../../LICENSE
      to: LICENSE
    - from: ../../native/win32/x64
      to: native/win32/x64
  extraResources:
    - from: .artifacts/enhancements/win32-${arch}/manifest.json
      to: enhancements/manifest.json
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  # 卸载钩子在 buildResources/installer.nsh（electron-builder 按约定自动 include，
  # 不要同时用 nsis.include 指一遍 —— 那样宏会重复定义）。它清理当前登录项及旧后台残留。

# Linux 目标：AppImage（单文件免安装，最通用）+ tar.gz（解压即用）。
# 架构由命令行决定：CI 里每个 runner 只打自己那一种（linux-x64 → --x64，
# linux-arm64 → --arm64），native/ 二进制通过下面的 extraFiles 按 ${arch}
# 自动挑对应架构（linux/x64 或 linux/arm64）。arm64 未经真机实测。
#
# ⚠️ 不要给 target 加 `arch: [x64, arm64]`：electron-builder 的 target.arch 会
# 覆盖 CLI 的 --x64 / --arm64（app-builder-lib computeArchToTargetNamesMap），
# 一次构建就会把两种架构都打出来；而 pnpm 装的 native binding
# （@resvg/resvg-js-linux-*-gnu、sherpa-onnx-linux-*）全是**构建机架构**的，于是非构建机架构的
# 包会带着错误架构的原生模块出厂：v1.0.0 的 weQ-1.0.0-linux-x86_64.AppImage
# 就是这么坏的 —— 在 arm64 runner 上打出来，包里是 aarch64 binding，启动即
# Cannot find module '@resvg/resvg-js-linux-x64-gnu'。
linux:
  icon: ../../resources/brand/logo.png
  # Wayland 会话默认走 XWayland：平铺合成器（Hyprland/sway）会把 `type: 'toolbar'`
  # 当成普通平铺窗口，且可能忽略程序化改尺寸。这个开关必须出现在 Electron 启动参数里
  # ——`app.commandLine.appendSwitch` 在 ready 前调用也来不及（详见
  # apps/desktop/src/main/linux_window_backend.ts）。用户可用 WEQ_OZONE_PLATFORM=wayland
  # 显式退回原生 Wayland；纯 X11 桌面上多传这个参数无害。
  executableArgs:
    - --ozone-platform=x11
    # 一旦设置 executableArgs，electron-builder 给 AppImage 的默认
    # `--no-sandbox` 就被整个替换掉了（AppImageTarget.js 的 `|| "--no-sandbox"`）。
    # AppImage 挂在 nosuid 的 FUSE 上，chrome-sandbox 的 setuid 位无用，禁用了
    # unprivileged userns 的发行版（如 Ubuntu 24.04）会直接起不来，所以补回来。
    - --no-sandbox
  # 打包字体（见顶部 extraResources 的说明）：Linux 发行版未必装 Noto CJK。
  extraResources:
    - from: ../../resources/assistant/fonts
      to: resources/assistant/fonts
    - from: .artifacts/enhancements/linux-${arch}/manifest.json
      to: enhancements/manifest.json
  extraFiles:
    - from: ../../LICENSE
      to: LICENSE
    - from: ../../native/linux/${arch}
      to: native/linux/${arch}
  target:
    - target: AppImage
    - target: tar.gz
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Network

# macOS 目标：dmg（手动安装）+ zip（Squirrel.Mac 自动更新必需 ——
# electron-updater 的 MacUpdater 只认 zip，仅 dmg 会报 "ZIP file not
# provided"）。架构同样交给命令行（macos-x64 → --x64，macos-arm64 → --arm64；
# 理由与 linux 一节相同：target.arch 会覆盖 CLI，另一架构的包会带上构建机的
# native 模块）。macOS 的 native/ 与 LICENSE 放在 Contents/Resources 下，
# 不把数据文件留在 Contents 根部破坏签名封装；加载器已有 resources/native 回退。
# macOS 没有注入型 dll/so（SIP），darwin/ 下只有 nt_helper.node——快登 /
# 扫码走纯协议，不再需要任何注入或沙箱容器文件。
# 开发包可补完整 ad-hoc 签名；release 显式使用固定自签证书，不是 Developer ID 或公证。
# 首次仍需按「隐私与安全性 → 仍要打开」放行。所有 macOS 更新均使用官方 Release
# 哈希验证和退出后安装助手；固定证书不改变安装方式。
mac:
  electronLanguages:
    - en
    - en_GB
    - zh_CN
    - zh_TW
  icon: ../../resources/brand/logo.png
  sign: ../../scripts/sign-macos.mjs
  # 仅主进程读取 QQ 调试副本；渲染子进程沿用默认继承权限。
  entitlements: build/entitlements.mac.plist
  # 打包字体（见顶部 extraResources 的说明）：macOS 的候选全是 .ttc，satori 读不了。
  extraResources:
    - from: out/main/macUpdateWorker.mjs
      to: out/main/macUpdateWorker.mjs
    - from: ../../LICENSE
      to: LICENSE
    - from: ../../native/darwin/${arch}
      to: native/darwin/${arch}
    - from: ../../resources/assistant/fonts
      to: resources/assistant/fonts
    - from: .artifacts/enhancements/darwin-${arch}/manifest.json
      to: enhancements/manifest.json
  target:
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.social-networking

# GitHub publish target for `electron-builder --publish always` (Release workflow).
# Generates + uploads latest.yml / *.blockmap that the in-app updater reads.
# 只上传到草稿；全部平台及检查完成后由 release 工作流统一公开。
publish:
  provider: github
  owner: weq-devs
  repo: WeQ
  releaseType: draft
