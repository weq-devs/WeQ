appId: app.weq.desktop
productName: weQ
copyright: Copyright © 2026 weQ contributors
directories:
  output: release/${version}
  buildResources: build
files:
  - "out/**/*"
  # Bare "package.json" was being resolved as a glob in this monorepo and
  # matched `../../packages/<name>/package.json` etc., which electron-builder
  # rejects ("must be under <appDir>"). Pin to the desktop app's own manifest.
  - "./package.json"
  # Keep runtime deps from this app's node_modules so bundled code can resolve
  # bare imports like `@electron-toolkit/utils` after installation.
  # Workspace packages are removed from the release manifest before packaging.
  - "node_modules/**/*"
  - "!node_modules/@weq/**/*"
extraResources:
  - from: ../../LICENSE
    to: ../LICENSE

  # Shared static assets (brand/logo, …). Copied whole so the main process can
  # read them at runtime via process.resourcesPath/resources. QQ emoji are NOT
  # bundled — they stream from the account's QQ NT dir at runtime.
  - from: ../../resources
    to: resources

  - from: node_modules/sherpa-onnx-node
    to: node_modules/sherpa-onnx-node

  - from: out/main/transcribeWorker.mjs
    to: out/main/transcribeWorker.mjs

  - from: out/main/injectWorker.mjs
    to: out/main/injectWorker.mjs

asarUnpack:
  # @resvg/resvg-js loads a platform .node binding (used by the WeQ 助手 cover
  # renderer in the main process). Native addons can't be loaded from inside the
  # asar, so unpack the resvg packages (base + per-platform binding).
  - node_modules/@resvg/**/*
  # # The voice-transcription worker is forked as a child process (can't run from
  # # inside the asar) and loads the native sherpa-onnx binding from node_modules.
  # - out/main/transcribeWorker.mjs

win:
  icon: ../../resources/brand/logo.png
  # native (.node) files live outside the source tree and are bundled at
  # package time, into the install root (NOT resources/) so the layout is
  # `<install>/native/<platform>/<arch>/…` — matching what the loader resolves
  # from process.platform/process.arch. Written per-platform because the
  # `${os}` macro expands to electron-builder's key ("win"/"linux"), not to
  # node's process.platform ("win32"/"linux").
  extraFiles:
    - from: ../../native/win32/x64
      to: native/win32/x64
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

# Linux 目标：AppImage（单文件免安装，最通用）+ tar.gz（解压即用）。
# x64 与 arm64 都出；native/ 二进制通过下面的 extraFiles 按 ${arch}
# 自动挑对应架构（linux/x64 或 linux/arm64）。arm64 未经真机实测。
linux:
  icon: ../../resources/brand/logo.png
  extraFiles:
    - from: ../../native/linux/${arch}
      to: native/linux/${arch}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Network

# macOS 目标：dmg（手动安装）+ zip（Squirrel.Mac 自动更新必需 ——
# electron-updater 的 MacUpdater 只认 zip，仅 dmg 会报 "ZIP file not
# provided"）。x64 与 arm64 都出；native/ 二进制与 win/linux 一样在打包时
# 拷到安装根目录的 native/<platform>/<arch>，与加载器按 process.arch 解析的
# 约定一致（darwin/x64 与 darwin/arm64，见 packages/native/src/loader.ts）。
# macOS 没有注入型 dll/so（SIP），darwin/ 下只有 nt_helper.node 和
# ninebird/{NineBird.node, qqnt.json}——darwin boot 启动 QQ 时会把
# NineBird.node 拷进 QQ 沙箱容器，所以 ninebird/ 也必须随包
# （win32/linux 专属的 NineBirdHook.dll / ninebird_launcher.so /
# ninebird_addon.node 不在这边）。
# 未配置 CSC_LINK / CSC_KEY_PASSWORD secrets 时产物不签名（Gatekeeper 会拦，
# 首次需右键 → 打开）；配置后 electron-builder 会自动签名，可再开 notarize。
mac:
  icon: ../../resources/brand/logo.png
  extraFiles:
    - from: ../../native/darwin/${arch}
      to: native/darwin/${arch}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.social-networking

# GitHub publish target for `electron-builder --publish always` (Release workflow).
# Generates + uploads latest.yml / *.blockmap that the in-app updater reads.
# releaseType: release => the Release is published (not a draft) and marked latest.
publish:
  provider: github
  owner: H3CoF6
  repo: WeQ
  releaseType: release
